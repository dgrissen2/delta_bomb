<svg viewBox="0 0 900 470" width="100%" role="img" aria-label="The delta bomb planting loop"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)"/></marker></defs><text x="450.0" y="20" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="var(--ink-3)">THE LOOP — YOU ARE ALWAYS IN ONE OF TWO STATES</text><rect x="150" y="40" width="600" height="150" rx="6" fill="var(--put-soft)" stroke="var(--put)" stroke-width="1.5"/><text x="164" y="64" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="var(--ink)">STATE A · a short is open  (this is where you start — the 50/20 itself)</text><text x="164" y="86" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)">You hold:   +1 anchor 4750P    –1 base 4575P    + any finished bombs</text><text x="164" y="103" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)">That is a 4750/4575 put debit spread. Defined risk. Nothing naked.</text><text x="164" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)">Waiting for:   a BOUNCE  (SPX up ~6 pts, or IV down)</text><text x="164" y="137" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)">Resting order:   BUY 4580P @ (price you sold the 4575P for – 0.25)</text><text x="164" y="154" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)">SPX dumps instead?  The 4750/4575 spread makes money — you're hedged, keep waiting.</text><text x="164" y="171" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)">SPX rips?  Anchor loses ~0.5/pt, but the 4580P gets cheap fast → the buy fills → State B.</text><rect x="150" y="260" width="600" height="150" rx="6" fill="var(--call-soft)" stroke="var(--call)" stroke-width="1.5"/><text x="164" y="284" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="var(--ink)">STATE B · nothing unpaired  (anchor + finished bombs)</text><text x="164" y="306" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)">You hold:   +1 anchor 4750P    + N finished bombs  [each = long 4580P / short 4575P, at a credit]</text><text x="164" y="323" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)">The only open risk is the anchor's premium (it's an ATM long put). Bombs can't lose.</text><text x="164" y="340" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)">Waiting for:   a DIP  (SPX down ~6 pts, or IV up)</text><text x="164" y="357" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)">Resting order:   SELL 4575P @ (price you paid for the last 4580P + 0.25)</text><text x="164" y="374" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)">SPX rips instead?  Anchor bleeds ~0.5/pt. You may just close it and stop with N bombs.</text><text x="164" y="391" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)">SPX dips?  The sell fills → State A again (the anchor covers the new short).</text><path d="M750,115 C840,115 840,335 750,335" fill="none" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#arr)"/><text x="768" y="212" font-family="SF Mono,Menlo,monospace" font-size="11" fill="var(--call)">bounce</text><text x="768" y="226" font-family="SF Mono,Menlo,monospace" font-size="11" fill="var(--call)">BUY fills</text><text x="768" y="244" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="var(--ink)">= +1 bomb</text><path d="M150,335 C60,335 60,115 150,115" fill="none" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#arr)"/><text x="132" y="212" text-anchor="end" font-family="SF Mono,Menlo,monospace" font-size="11" fill="var(--put)">dip</text><text x="132" y="226" text-anchor="end" font-family="SF Mono,Menlo,monospace" font-size="11" fill="var(--put)">SELL fills</text><text x="132" y="244" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="var(--ink-2)">short open again</text><text x="450.0" y="440" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink)"><tspan font-weight="700">Stop</tspan> in State B: sell the anchor — or, if a late dip puts the 4745P bid ≥ anchor cost + 0.25, sell that and the anchor becomes a free 4750/4745 spread.</text><text x="450.0" y="460" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="var(--ink-2)"><tspan font-weight="700" fill="var(--ink)">One short open at a time.</tspan> A second unpaired short is naked below the anchor's coverage. Want more per lap → more anchors, or long-first ladders (§4b).</text></svg>