# hiro_engine frozen configuration — every numeric in R1-R7 of docs/hiro_engine/requirements.md.
# spec_version stamps the RULE SET so any rule change moves CONFIG_HASH (R8.2/R9 reset).
# CONFIG_HASH = sha256 of this file's bytes (R8.2). Editing ANY byte changes the hash and
# resets the 10-session acceptance test (R9). Do not touch during the test.

spec_version: "3.0"   # v3.0: real resting-limit fills (requirements v3.0, 2026-08-23)

r1_instruments:
  width_strikes: 5            # R1.1 vertical width in strike points
  dte_target: 30              # R1.1 expiry nearest 30 DTE
  dte_min: 20                 # R1.1 window low
  dte_max: 40                 # R1.1 window high
  delta_target: -0.20         # R1.2 base strike delta
  size_contracts: 1           # R1.3 paper, always
  fill_touch_pts: 3.0         # R1.4 completion proxy from S0

r3_derived:
  run_break_dd: 0.6           # R3.2 run-break drawdown ($B)
  roll_window: 30             # R3.3 pull30/bounce30/mid30 window (strict min_periods)
  range60_window: 60          # R3.3 prior-60-min range
  range60_pctile: 0.75        # R3.3 expanding percentile
  range60_min_obs: 300        # R3.3 warmup floor
  context_im_frac: 0.10       # R3.4 |close - open0930| >= 0.10 * IM
  context_vwap_share: 0.80    # R3.4 share of last 10 bars vs VWAP
  context_vwap_bars: 10       # R3.4 lookback bars
  context_reads_min: [630, 780]   # R3.4 10:30 and 13:00 ET (minutes since midnight)
  episode_lapse_min: 3        # R3.5 conditions lapse >= 3 consecutive minutes

r4_vetoes:
  flow_veto_bps: -0.8         # R4.3 r15 AND r15n both below this ($B)

r5_clock:
  observe_end_min: 600        # R5.1 09:30-10:00 observe only
  entry_end_min: 870          # R5.2 no new unpaired leg after 14:30
  branch_a_start_min: 635     # R5.2 Branch A additionally >= 10:35
  clock_minutes: 60           # R5.3 per-leg clock
  resolution_min: 930         # R5.4 15:30 hard resolution
  session_end_min: 960        # 16:00 tracking stops

r6_entries:
  a_bounce_min_pts: 3.0       # R6.1(iii)
  b_pull_min_pts: 3.0         # R6.2 arm pullback
  b_dur_min: 10               # R6.2 run duration (min)
  b_rate_min: 2.0             # R6.2 run rate ($B/hr)
  b_cpr_min: 0.25             # R6.2 min/max of dC,dP
  b_share_min: 0.5            # R6.2 nextExp share of run
  b_weak_side_min: 0.15       # R6.2 gate: min(dC,dP) ($B)
  late_rate: 4.0              # R6.3 suppression rate ($B/hr)
  late_r30: 1.0               # R6.3 suppression 30-min flow ($B)
  entries_per_day: 3          # R6.4
  rest_offset: 0.10           # R6.1/R6.2 resting-limit offset vs first leg

r7_exits:
  scratch_drop_bps: 0.3       # R7.2 L drop below entry value ($B)
  scratch_window_min: 3       # R7.2 within 3 minutes of entry
  cap_option_pts: 3.5         # R7.3 option-mid move against leg-1 fill
  cap_spot_pts: 15.0          # R7.3 spot fallback (quote-gap only, v3.0)
  heartbeat_min: 5            # AC: heartbeat cadence while a trade is open

r1v3_limits:                  # v3.0 resting-limit mechanics (R1.4)
  credit: 0.10                # FROZEN — not a knob (R13.2)
  limit_tick: 0.10            # premium grid at these strikes; L rounds AGAINST us
  first_eligible_offset: 2    # first fill-eligible minute = signal + 2
  quote_gap_invalid_after: 5  # consecutive gap minutes -> cancel + data_invalid (R10.4)
  exit_stale_quote_max_min: 3 # last-valid NBBO allowance for exit BOOKING only

